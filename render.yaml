services:
  - type: web
    name: leadhunter-pro-saas
    env: docker
    plan: starter
    disk:
      name: leadhunter-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
