<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadHunter Pro - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Alexandria', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            bg: '#f5f5f7',
                            card: '#ffffff',
                            text: '#1d1d1f',
                            subtext: '#86868b',
                            blue: '#0066cc',
                            blueHover: '#0077ed',
                            border: '#d2d2d7'
                        }
                    },
                    boxShadow: {
                        'apple': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'apple-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #86868b; }

        .sidebar-link {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-link:hover {
            background-color: #f5f5f7;
            transform: translateX(-4px);
        }
        .sidebar-link.active {
            background-color: #0066cc;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }
        .sidebar-link.active i { color: white; }

        input, select {
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.15);
        }

        .btn-primary {
            background-color: #0066cc;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0077ed;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .hidden { display: none !important; }
        
        /* Terminal */
        .terminal {
            background: #1e1e1e;
            color: #4af626;
            font-family: monospace;
            border-radius: 1rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex items-center justify-center relative">

    <!-- ==================== صفحة الدخول والتسجيل (Apple ID Style) ==================== -->
    <div id="auth-section" class="z-10 w-full max-w-md p-10 bg-white rounded-[2rem] shadow-apple transition-all duration-500 border border-apple-border/50">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-gradient-to-br from-gray-900 to-gray-700 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-crosshairs text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-apple-text mb-2">تسجيل الدخول للنظام</h1>
            <p class="text-apple-subtext text-sm font-medium">استخدم بيانات اعتماد LeadHunter الخاصة بك.</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <input type="email" id="login-email" class="w-full bg-apple-bg border border-apple-border rounded-xl px-4 py-3.5 text-apple-text focus:outline-none focus:border-apple-blue focus:bg-white text-base" placeholder="البريد الإلكتروني" required>
            </div>
            <div>
                <input type="password" id="login-password" class="w-full bg-apple-bg border border-apple-border rounded-xl px-4 py-3.5 text-apple-text focus:outline-none focus:border-apple-blue focus:bg-white text-base" placeholder="كلمة المرور" required>
            </div>
            <button type="submit" class="w-full btn-primary font-semibold py-3.5 rounded-xl mt-4 text-base">
                متابعة
            </button>
            <div class="text-center mt-6">
                <a href="#" id="show-register" class="text-apple-blue hover:text-apple-blueHover text-sm font-medium">إنشاء حساب جديد</a>
            </div>
        </form>

        <form id="register-form" class="space-y-5 hidden">
            <div>
                <input type="text" id="reg-name" class="w-full bg-apple-bg border border-apple-border rounded-xl px-4 py-3.5 text-apple-text focus:outline-none focus:border-apple-blue focus:bg-white" placeholder="الاسم الكامل" required>
            </div>
            <div>
                <input type="email" id="reg-email" class="w-full bg-apple-bg border border-apple-border rounded-xl px-4 py-3.5 text-apple-text focus:outline-none focus:border-apple-blue focus:bg-white" placeholder="البريد الإلكتروني" required>
            </div>
            <div>
                <input type="password" id="reg-password" class="w-full bg-apple-bg border border-apple-border rounded-xl px-4 py-3.5 text-apple-text focus:outline-none focus:border-apple-blue focus:bg-white" placeholder="كلمة المرور" required>
            </div>
            <div>
                <select id="reg-role" class="w-full bg-apple-bg border border-apple-border rounded-xl px-4 py-3.5 text-apple-text focus:outline-none focus:border-apple-blue focus:bg-white cursor-pointer">
                    <option value="admin">مدير النظام (Admin)</option>
                    <option value="user">مستخدم عادي (User)</option>
                </select>
            </div>
            <button type="submit" class="w-full btn-primary font-semibold py-3.5 rounded-xl mt-4">
                إنشاء الحساب
            </button>
            <div class="text-center mt-6">
                <a href="#" id="show-login" class="text-apple-blue hover:text-apple-blueHover text-sm font-medium">العودة لتسجيل الدخول</a>
            </div>
        </form>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
